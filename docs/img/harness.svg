<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>How a number is produced: the benchmark harness</title>
  <rect x="0" y="0" width="820" height="400" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- harness container -->
  <rect x="20" y="40" width="300" height="300" rx="8" fill="#f4f6fa" stroke="#2a64b4" stroke-width="1.5"/>
  <text x="34" y="62" font-size="13" font-weight="600" fill="#2a64b4">harness container</text>
  <text x="34" y="78" font-size="10.5" fill="#555">docker/run_harness.sh · refuses to share the GPU</text>

  <rect x="38" y="92" width="264" height="58" rx="6" fill="#fff" stroke="#999"/>
  <text x="50" y="112" font-size="12" font-weight="600" fill="#1a1a1a">load generator</text>
  <text x="50" y="128" font-size="10.5" fill="#333">open loop (Poisson) · closed · sequential</text>
  <text x="50" y="142" font-size="10.5" fill="#333">tracks its own scheduling lag → client-bound?</text>

  <rect x="38" y="162" width="264" height="58" rx="6" fill="#fff" stroke="#999"/>
  <text x="50" y="182" font-size="12" font-weight="600" fill="#1a1a1a">streaming client</text>
  <text x="50" y="198" font-size="10.5" fill="#333">TTFT at the first non-empty content chunk</text>
  <text x="50" y="212" font-size="10.5" fill="#333">TPOT · failures recorded, never dropped</text>

  <rect x="38" y="232" width="264" height="58" rx="6" fill="#fff" stroke="#999"/>
  <text x="50" y="252" font-size="12" font-weight="600" fill="#1a1a1a">scorer + guards</text>
  <text x="50" y="268" font-size="10.5" fill="#333">ANLS · relaxed · exact match · multiple choice</text>
  <text x="50" y="282" font-size="10.5" fill="#333">&gt;1% failed or all failed → not a measurement</text>

  <text x="38" y="318" font-size="10.5" fill="#555">GPU sampler, 1 Hz: clocks, power, temperature,</text>
  <text x="38" y="332" font-size="10.5" fill="#555">driver throttle reasons — during the run, not after</text>

  <!-- server -->
  <rect x="400" y="92" width="200" height="128" rx="8" fill="#fbf1ec" stroke="#c1440e" stroke-width="1.5"/>
  <text x="414" y="114" font-size="13" font-weight="600" fill="#c1440e">server container</text>
  <text x="414" y="132" font-size="10.5" fill="#333">vLLM or SGLang, pinned image</text>
  <text x="414" y="148" font-size="10.5" fill="#333">settings from arms/*.yaml</text>
  <text x="414" y="164" font-size="10.5" fill="#333">caches OFF in the baseline</text>
  <text x="414" y="180" font-size="10.5" fill="#333">VRAM preflight before start;</text>
  <text x="414" y="194" font-size="10.5" fill="#333">refuses a detector beside it</text>

  <!-- gpu -->
  <rect x="650" y="112" width="150" height="88" rx="8" fill="#eef6f1" stroke="#1f8a52" stroke-width="1.5"/>
  <text x="664" y="136" font-size="13" font-weight="600" fill="#1f8a52">RTX 3090</text>
  <text x="664" y="154" font-size="10.5" fill="#333">24 GB · 936 GB/s</text>
  <text x="664" y="170" font-size="10.5" fill="#333">350 W cap (power-</text>
  <text x="664" y="184" font-size="10.5" fill="#333">limited, not thermal)</text>

  <!-- arrows -->
  <line x1="302" y1="190" x2="398" y2="165" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="332" y="166" font-size="10" fill="#333">requests</text>
  <line x1="398" y1="185" x2="304" y2="208" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="332" y="226" font-size="10" fill="#333">token stream</text>
  <line x1="600" y1="156" x2="648" y2="156" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- results -->
  <rect x="400" y="258" width="400" height="82" rx="8" fill="#f7f4fb" stroke="#8a5cb8" stroke-width="1.5"/>
  <text x="414" y="280" font-size="13" font-weight="600" fill="#8a5cb8">results/&lt;run&gt;/</text>
  <text x="414" y="298" font-size="10.5" fill="#333">latency.jsonl · outputs.jsonl · summary.json</text>
  <text x="414" y="314" font-size="10.5" fill="#333">meta.json: git SHA + dirty flag, image digests, arm,</text>
  <text x="414" y="328" font-size="10.5" fill="#333">input digests, thermal record, what it does NOT measure</text>
  <line x1="302" y1="262" x2="398" y2="296" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>

  <text x="20" y="372" font-size="11" fill="#555">Results flow one way: produced on the rig, pulled to the authoring machine, never synced back.</text>
</svg>
