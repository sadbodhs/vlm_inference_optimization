site_name: VLM Inference Optimization
site_description: What a vision-language model costs to serve on one RTX 3090, and what making it cheaper costs in accuracy
repo_url: https://github.com/sadbodhs/vlm_inference_optimization
repo_name: sadbodhs/vlm_inference_optimization
docs_dir: site_src

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra:
  social:
    - icon: material/home
      link: https://sadbodhs.github.io/
      name: Sadbodh — the bench
    - icon: material/microscope
      link: https://sadbodhs.github.io/computer_vision_optimization/
      name: The CV serving study
    - icon: fontawesome/brands/github
      link: https://github.com/sadbodhs/vlm_inference_optimization
      name: This repository

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - ← Sadbodh · the bench: https://sadbodhs.github.io/
  - The question: index.md
  - Overview: overview.md
  - Methodology: methodology.md
  - Results:
      - E1 · Decode vs the roofline: e1-roofline.md
      - E2 · What a vision token costs: e2-vision-tokens.md
      - E3 · The accuracy frontier: e3-token-budget.md
      - The per-task frontier: task-frontier.md
      - E0 · Capacity and goodput: e0-saturation.md
      - E4 · Live video: e4-video.md
      - E6 · Temporal budget: e6-temporal-budget.md
      - E7 · The cascade: e7-cascade.md
      - E7b · The cascade, live: e7b-live.md
      - E7c · The cascade, DeepStream: e7c-deepstream.md
      - E7d · Which VLM behind the gate: e7d-models.md
      - vLLM vs SGLang: stacks.md
      - Qwen2.5 vs Qwen3: models.md
  - Track B · VLMs in real-time CV:
      - Overview: recipe.md
      - R1 · The actor-crop reference level: r1-actor-crops.md
      - R1b · Label-free crops: r1b-label-free.md
      - R2 · Manufacturing (HA4M): r2-manufacturing.md
  - Corrections: corrections.md
  - Not measured: not-measured.md
  - Reproduce: reproduce.md
