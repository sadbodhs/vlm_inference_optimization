# Spine arm. Everything in the study runs against this one first.
id: B_vllm_awq
stack: vllm
model: Qwen/Qwen2.5-VL-7B-Instruct-AWQ
# Weights pinned by commit, not just by name: a HF repo can be updated in
# place, and an image digest without a weights revision is half a pin.
revision: 536a35794df8831aa814970ee8f89eff577e7718
base_url: http://vlm-server:8000   # container name on the vlmbench network
quantization: awq_marlin

# LLM weights 4-bit + vision tower left FP16. Used for the E1 roofline; it is a
# declared quantity, not a measured one -- verify with nvidia-smi after load.
# Exact, summed from the safetensors headers (tools/weight_split.py), not from
# the server's loaded footprint: the 6.67 GiB vLLM reports includes allocator
# padding, and an estimate here is what made E1 first read 114% of roofline.
weight_bytes: 6.924e+9
# Decode re-reads only the LLM weights; the ~675M-param bf16 vision tower (~1.26 GiB)
# runs once in prefill and is never touched again while tokens stream.
decode_weight_bytes: 5.571e+9
max_tokens: 128
temperature: 0.0

# Never leave this unset on a dynamic-resolution model: the stack default lets one
# full-page scan expand into thousands of vision tokens and stall the batch.
# 1605632 = 1268^2 ~= 2048 vision tokens at 784 px/token.
max_pixels: 1605632

# Verified against the published config.json, not assumed:
#   4-bit AWQ GEMM, group_size 128, zero_point true -> awq_marlin is valid on sm_86
#   modules_to_not_convert: ["visual"]  -> the vision tower ships bf16, unquantized
#   28 layers x 4 KV heads x 128 head_dim -> 56.0 KB of KV per token (FP16)
#   spatial_patch_size 14 with 2x2 merge -> 784 px per vision token
#   repo size on disk: 6.94 GB
# NOT a neutral baseline: v0.29.0 enables prefix caching, chunked prefill and a
# 4 GB multimodal cache by default. This arm answers "what does vLLM do as
# shipped"; use B0_vllm_awq_clean as the reference point for attributing wins.
notes: >
  Server: docker/run_vllm.sh start arms/B_vllm_awq.yaml
  (vllm/vllm-openai:v0.29.0, --quantization awq_marlin, --max-model-len 8192,
  --gpu-memory-utilization 0.90, --limit-mm-per-prompt image=1).
  Needs ~22.1 GB of the 24 GB card at util 0.90, so the GPU must be otherwise idle.
