[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-prune"
version = "0.1.0"
description = "Pre-encoder video token pruning for Qwen2.5-VL in vLLM (E9)"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
vlm_prune = "vlm_prune:register"

[tool.setuptools]
packages = ["vlm_prune"]
